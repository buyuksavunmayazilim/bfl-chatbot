<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Büyük Filo — Asistan</title>

  <style>
    :root { --brand: #537286; }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    button,
    input {
      font: inherit;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      max-width: 100%;
      background: #fff;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ───────────────── Header ───────────────── */

    .header {
      background: var(--brand);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      font-weight: 600;
      flex-shrink: 0;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header-info p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 1px;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }

    .new-session-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition:
        background 0.15s,
        transform 0.1s;
    }

    .new-session-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .new-session-btn:active {
      transform: scale(0.95);
    }

    .new-session-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* ───────────────── Messages ───────────────── */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 88%;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.bot {
      align-self: flex-start;
    }

    .msg-av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .bot .msg-av {
      background: #e8eef6;
      color: var(--brand);
    }

    .user .msg-av {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .msg-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .bot .bubble {
      background: #f1f3f5;
      color: #212529;
      border-radius: 4px 16px 16px 16px;
    }

    .user .bubble {
      background: var(--brand);
      color: #fff;
      border-radius: 16px 4px 16px 16px;
    }

    /* ───────────────── Form linkleri ───────────────── */

    .form-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .form-link {
      display: inline-block;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e8eef6;
      color: var(--brand);
      text-decoration: none;
      border: 1px solid #c5d4e8;
      transition: background 0.15s;
    }

    .form-link:hover {
      background: #d0dff0;
    }

    /* ───────────────── Meta ───────────────── */

    .meta {
      font-size: 11px;
      color: #adb5bd;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user .meta {
      justify-content: flex-end;
    }

    .badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge.k1 {
      background: #d4edda;
      color: #155724;
    }

    .badge.k2 {
      background: #cce5ff;
      color: #004085;
    }

    .badge.fb {
      background: #fff3cd;
      color: #856404;
    }

    /* ───────────────── Typing ───────────────── */

    .typing-wrap {
      display: flex;
      gap: 8px;
      align-self: flex-start;
      max-width: 88%;
    }

    .typing-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e8eef6;
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .typing-bubble {
      padding: 10px 16px;
      background: #f1f3f5;
      border-radius: 4px 16px 16px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #adb5bd;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* ───────────────── Input ───────────────── */

    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #e9ecef;
      background: #fff;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid #dee2e6;
      border-radius: 24px;
      outline: none;
      color: #212529;
      background: #f8f9fa;
      transition:
        border-color 0.15s,
        background 0.15s;
    }

    .input-area input:focus {
      border-color: var(--brand);
      background: #fff;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--brand);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition:
        background 0.15s,
        transform 0.1s;
    }

    .send-btn:hover {
      background: #425b6b;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      background: #adb5bd;
      cursor: default;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    /* ───────────────── Hata ───────────────── */

    .error-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ffe3e3;
      color: #c92a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .error-bubble {
      padding: 10px 14px;
      background: #fff3f3;
      border: 1px solid #ffc9c9;
      color: #c92a2a;
      border-radius: 4px 16px 16px 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ───────────────── Scrollbar ───────────────── */

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #dee2e6;
      border-radius: 4px;
    }

    /* ───────────────── Mobil ───────────────── */

    @media (max-width: 480px) {
      .header {
        padding: 12px 14px;
      }

      .messages {
        padding: 14px 12px;
      }

      .input-area {
        padding: 10px 12px;
      }

      .msg {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <header class="header">
      <div class="header-avatar" id="bf-avatar">BF</div>

      <div class="header-info">
        <h1 id="bf-title">Büyük Filo Asistan</h1>
        <p id="bf-subtitle">Araç kiralama &amp; destek</p>
      </div>

      <div
        class="online-dot"
        title="Çevrimiçi"
        aria-label="Çevrimiçi"
      ></div>

      <button
        type="button"
        class="new-session-btn"
        id="new-session-btn"
        title="Yeni konuşma başlat"
        aria-label="Yeni konuşma başlat"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6a6 6 0 0 1-10.9 3.48l-1.46 1.36A8 8 0 1 0 12 5z"
          />
        </svg>
      </button>
    </header>

    <main
      class="messages"
      id="messages"
      aria-live="polite"
      aria-label="Sohbet mesajları"
    >
      <div class="msg bot">
        <div class="msg-av" id="bf-welcome-av">BF</div>

        <div class="msg-body">
          <div class="bubble" id="bf-greeting">
            Merhaba! Büyük Filo'ya hoş geldiniz 👋
            <br><br>
            Araç arızası, hasar bildirimi, servis, lastik değişimi,
            teklif alma veya genel sorularınız için buradayım.
          </div>

          <div class="meta">Asistan</div>
        </div>
      </div>
    </main>

    <div class="input-area">
      <input
        type="text"
        id="msg-input"
        placeholder="Mesajınızı yazın..."
        autocomplete="off"
        maxlength="2000"
        aria-label="Mesajınızı yazın"
      >

      <button
        type="button"
        class="send-btn"
        id="send-btn"
        aria-label="Mesaj gönder"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </div>

  <script>
    "use strict";

    /*
     * Kullanım seçenekleri:
     *
     * 1. Aynı domain:
     *    /chat
     *
     * 2. URL parametresi:
     *    /chat?tenant_id=buyuk-filo
     *
     * 3. Farklı API domain'i:
     *    /chat?tenant_id=buyuk-filo
     *         &api_base=https://chat-api.example.com
     *
     * Daha sonra widget.js iframe URL'sini bu bilgilerle oluşturabilir.
     */

    const queryParams = new URLSearchParams(window.location.search);

    const globalConfig = window.BFLChatConfig || {};

    const TENANT_ID =
      queryParams.get("tenant_id") ||
      globalConfig.tenantId ||
      "bfl";

    const API_BASE_URL = (
      queryParams.get("api_base") ||
      globalConfig.apiBaseUrl ||
      ""
    ).replace(/\/+$/, "");

    const API = API_BASE_URL
      ? `${API_BASE_URL}/api/${TENANT_ID}/chat`
      : `/api/${TENANT_ID}/chat`;

    // Widget branding'i sunucudan cek (baslik/alt baslik/avatar/karsilama/renk)
    let WIDGET_AVATAR = "BF";
    const CONFIG_URL = API_BASE_URL
      ? `${API_BASE_URL}/api/${TENANT_ID}/config`
      : `/api/${TENANT_ID}/config`;
    fetch(CONFIG_URL).then(r => r.json()).then(cfg => {
      if (!cfg) return;
      if (cfg.color) document.documentElement.style.setProperty("--brand", cfg.color);
      if (cfg.title) { const e = document.getElementById("bf-title"); if (e) e.textContent = cfg.title; document.title = cfg.title; }
      if (cfg.subtitle) { const e = document.getElementById("bf-subtitle"); if (e) e.textContent = cfg.subtitle; }
      if (cfg.avatar) {
        WIDGET_AVATAR = cfg.avatar;
        const h = document.getElementById("bf-avatar"); if (h) h.textContent = cfg.avatar;
        const w = document.getElementById("bf-welcome-av"); if (w) w.textContent = cfg.avatar;
      }
      if (cfg.greeting) { const g = document.getElementById("bf-greeting"); if (g) g.textContent = cfg.greeting; }
    }).catch(() => {});

    const SESSION_STORAGE_KEY =
      `bfl_chat_session:${TENANT_ID}`;

    const msgsEl =
      document.getElementById("messages");

    const inputEl =
      document.getElementById("msg-input");

    const sendBtn =
      document.getElementById("send-btn");

    const newSessionBtn =
      document.getElementById("new-session-btn");

    const BADGE = {
      k1_keyword: ["K1", "k1"],
      k2_similarity: ["K2", "k2"],
      fallback: ["FB", "fb"]
    };

    function generateSessionId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        return window.crypto.randomUUID();
      }

      /*
       * Eski tarayıcılar için yedek yöntem.
       * Modern production tarayıcılarında crypto.randomUUID kullanılır.
       */
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        .replace(/[xy]/g, function (character) {
          const randomValue =
            Math.random() * 16 | 0;

          const value =
            character === "x"
              ? randomValue
              : (randomValue & 0x3) | 0x8;

          return value.toString(16);
        });
    }

    function getSessionId() {
      let sessionId = null;

      try {
        sessionId =
          localStorage.getItem(SESSION_STORAGE_KEY);
      } catch (error) {
        console.warn(
          "[Chat] localStorage okunamadı:",
          error
        );
      }

      if (!sessionId) {
        sessionId = generateSessionId();

        try {
          localStorage.setItem(
            SESSION_STORAGE_KEY,
            sessionId
          );
        } catch (error) {
          console.warn(
            "[Chat] Session localStorage'a yazılamadı:",
            error
          );
        }
      }

      return sessionId;
    }

    function createNewSession() {
      const sessionId = generateSessionId();

      try {
        localStorage.setItem(
          SESSION_STORAGE_KEY,
          sessionId
        );
      } catch (error) {
        console.warn(
          "[Chat] Yeni session kaydedilemedi:",
          error
        );
      }

      msgsEl.innerHTML = "";

      addBotMsg(
        "Yeni konuşma başlatıldı. Size nasıl yardımcı olabilirim?",
        null
      );

      inputEl.value = "";
      inputEl.focus();
    }

    function scrollDown() {
      requestAnimationFrame(function () {
        msgsEl.scrollTop = msgsEl.scrollHeight;
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
        .replace(/\n/g, "<br>");
    }

    function formatKey(key) {
      return String(key ?? "")
        .replace(/_/g, " ")
        .replace(
          /\b\w/g,
          function (character) {
            return character.toUpperCase();
          }
        );
    }

    function sanitizeUrl(value) {
      if (!value) {
        return null;
      }

      try {
        const url = new URL(
          value,
          window.location.origin
        );

        if (
          url.protocol !== "http:" &&
          url.protocol !== "https:"
        ) {
          return null;
        }

        return url.href;
      } catch (error) {
        return null;
      }
    }

    function addUserMsg(text) {
      const wrap =
        document.createElement("div");

      wrap.className = "msg user";

      wrap.innerHTML = `
        <div class="msg-av">Siz</div>

        <div class="msg-body">
          <div class="bubble">
            ${escapeHtml(text)}
          </div>

          <div class="meta">Siz</div>
        </div>
      `;

      msgsEl.appendChild(wrap);
      scrollDown();
    }

    function addBotMsg(text, meta) {
      const wrap =
        document.createElement("div");

      wrap.className = "msg bot";

      let linksHtml = "";

      if (
        meta &&
        meta.form_urls &&
        typeof meta.form_urls === "object"
      ) {
        const links = Object.entries(meta.form_urls)
          .map(function ([key, value]) {
            const safeUrl = sanitizeUrl(value);

            if (!safeUrl) {
              return "";
            }

            return `
              <a
                class="form-link"
                href="${escapeHtml(safeUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHtml(formatKey(key))}
              </a>
            `;
          })
          .filter(Boolean)
          .join("");

        if (links) {
          linksHtml = `
            <div class="form-links">
              ${links}
            </div>
          `;
        }
      }

      let metaHtml = "Asistan";

      if (meta && meta.source) {
        const badgeInfo =
          BADGE[meta.source] || ["", ""];

        const label = badgeInfo[0];
        const className = badgeInfo[1];

        const badge = label
          ? `
            <span class="badge ${className}">
              ${label}
            </span>
          `
          : "";

        const confidence =
          typeof meta.confidence === "number"
            ? ` · %${Math.round(meta.confidence * 100)}`
            : "";

        const responseMs =
          typeof meta.response_ms === "number"
            ? ` · ${Math.round(meta.response_ms)}ms`
            : "";

        metaHtml =
          `Asistan ${badge}${confidence}${responseMs}`;
      }

      wrap.innerHTML = `
        <div class="msg-av">${WIDGET_AVATAR}</div>

        <div class="msg-body">
          <div class="bubble">
            ${escapeHtml(text)}
            ${linksHtml}
          </div>

          <div class="meta">
            ${metaHtml}
          </div>
        </div>
      `;

      msgsEl.appendChild(wrap);
      scrollDown();
    }

    function addTyping() {
      removeTyping();

      const element =
        document.createElement("div");

      element.className = "typing-wrap";
      element.id = "typing";

      element.innerHTML = `
        <div class="typing-avatar">BF</div>

        <div class="typing-bubble">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `;

      msgsEl.appendChild(element);
      scrollDown();
    }

    function removeTyping() {
      const element =
        document.getElementById("typing");

      if (element) {
        element.remove();
      }
    }

    function addError(text) {
      const wrap =
        document.createElement("div");

      wrap.className = "msg bot";

      wrap.innerHTML = `
        <div class="error-avatar">!</div>

        <div class="msg-body">
          <div class="error-bubble">
            ${escapeHtml(text)}
          </div>
        </div>
      `;

      msgsEl.appendChild(wrap);
      scrollDown();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();

      if (!text || sendBtn.disabled) {
        return;
      }

      const sessionId = getSessionId();

      inputEl.value = "";
      sendBtn.disabled = true;

      addUserMsg(text);
      addTyping();

      const requestBody = {
        session_id: sessionId,
        message: text
      };

      /*
       * Mevcut backend tenant_id beklemese bile Pydantic'in
       * varsayılan davranışında ekstra alan genellikle yok sayılır.
       *
       * Backend tenant desteği eklendiğinde bu alan hazır olacak.
       */
      if (TENANT_ID) {
        requestBody.tenant_id = TENANT_ID;
      }

      try {
        const response = await fetch(API, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(requestBody)
        });

        removeTyping();

        if (!response.ok) {
          let serverError = "";

          try {
            serverError = await response.text();
          } catch (error) {
            serverError = "";
          }

          console.error(
            "[Chat] API hatası:",
            response.status,
            serverError
          );

          addError(
            "İşleminiz şu anda tamamlanamadı. Lütfen tekrar deneyin."
          );

          return;
        }

        const data = await response.json();

        if (
          !data ||
          typeof data.message !== "string"
        ) {
          throw new Error(
            "API yanıt formatı geçersiz."
          );
        }

        addBotMsg(
          data.message,
          data
        );
      } catch (error) {
        removeTyping();

        console.error(
          "[Chat] Bağlantı hatası:",
          error
        );

        addError(
          "Sunucuya bağlanılamadı. Lütfen bağlantınızı kontrol edip tekrar deneyin."
        );
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener(
      "click",
      sendMessage
    );

    newSessionBtn.addEventListener(
      "click",
      createNewSession
    );

    inputEl.addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );

    /*
     * Sayfa açıldığında session oluşturulur veya
     * önceki session localStorage'dan alınır.
     */
    getSessionId();
    inputEl.focus();
  </script>

</body>
</html>
