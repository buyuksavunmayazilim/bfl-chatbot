<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büyük Filo — Asistan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    display: flex;
    flex-direction: column;
    height: 620px;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    background: #1A3C6E;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .header-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff; font-weight: 600;
    flex-shrink: 0;
  }

  .header-info { flex: 1; }
  .header-info h1 { font-size: 15px; font-weight: 600; color: #fff; }
  .header-info p  { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 1px; }

  .online-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #4ade80;
    flex-shrink: 0;
  }

  /* ── Session bar ── */
  .session-bar {
    background: #f8f9fa;
    border-bottom: 1px solid #e9ecef;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .session-bar label {
    font-size: 11px;
    color: #6c757d;
    white-space: nowrap;
  }

  .session-bar input {
    flex: 1;
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    outline: none;
    color: #495057;
    background: #fff;
  }

  .session-bar input:focus { border-color: #1A3C6E; }

  .new-session-btn {
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    color: #6c757d;
    white-space: nowrap;
  }

  .new-session-btn:hover { background: #f1f3f5; }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .msg-av {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .bot  .msg-av { background: #e8eef6; color: #1A3C6E; }
  .user .msg-av { background: #e8f5e9; color: #2e7d32; }

  .msg-body { display: flex; flex-direction: column; gap: 3px; }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
  }

  .bot .bubble {
    background: #f1f3f5;
    color: #212529;
    border-radius: 4px 16px 16px 16px;
  }

  .user .bubble {
    background: #1A3C6E;
    color: #fff;
    border-radius: 16px 4px 16px 16px;
  }

  /* Form linkleri */
  .form-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .form-link {
    display: inline-block;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #e8eef6;
    color: #1A3C6E;
    text-decoration: none;
    border: 1px solid #c5d4e8;
    transition: background 0.15s;
  }

  .form-link:hover { background: #d0dff0; }

  /* Meta satırı */
  .meta {
    font-size: 11px;
    color: #adb5bd;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .user .meta { justify-content: flex-end; }

  .badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 600;
  }

  .badge.k1 { background: #d4edda; color: #155724; }
  .badge.k2 { background: #cce5ff; color: #004085; }
  .badge.fb { background: #fff3cd; color: #856404; }

  /* Typing indicator */
  .typing-wrap { display: flex; gap: 8px; align-self: flex-start; max-width: 88%; }

  .typing-bubble {
    padding: 10px 16px;
    background: #f1f3f5;
    border-radius: 4px 16px 16px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #adb5bd;
    animation: bounce 1.2s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* ── Input ── */
  .input-area {
    padding: 12px 16px;
    border-top: 1px solid #e9ecef;
    background: #fff;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid #dee2e6;
    border-radius: 24px;
    outline: none;
    color: #212529;
    background: #f8f9fa;
    transition: border-color 0.15s, background 0.15s;
  }

  .input-area input:focus {
    border-color: #1A3C6E;
    background: #fff;
  }

  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #1A3C6E;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .send-btn:hover   { background: #2E75B6; }
  .send-btn:active  { transform: scale(0.95); }
  .send-btn:disabled { background: #adb5bd; cursor: default; }

  .send-btn svg { width: 18px; height: 18px; fill: #fff; }

  /* ── Hata balonu ── */
  .error-bubble {
    padding: 10px 14px;
    background: #fff3f3;
    border: 1px solid #ffc9c9;
    color: #c92a2a;
    border-radius: 4px 16px 16px 16px;
    font-size: 13px;
    line-height: 1.5;
  }

  /* Scrollbar */
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 4px; }
</style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <div class="header-avatar">BF</div>
    <div class="header-info">
      <h1>Büyük Filo Asistan</h1>
      <p>Araç kiralama & destek</p>
    </div>
    <div class="online-dot" title="Çevrimiçi"></div>
  </div>

  <!-- Session bar -->
  <div class="session-bar">
    <label>Oturum:</label>
    <input type="text" id="session-id" value="user-001" />
    <button class="new-session-btn" onclick="newSession()">Yeni</button>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="msg-av">BF</div>
      <div class="msg-body">
        <div class="bubble">
          Merhaba! Büyük Filo'ya hoş geldiniz 👋<br><br>
          Araç arızası, hasar bildirimi, servis, lastik değişimi, teklif alma veya genel sorularınız için buradayım.
        </div>
        <div class="meta">Asistan</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <input
      type="text"
      id="msg-input"
      placeholder="Mesajınızı yazın..."
      autocomplete="off"
    />
    <button class="send-btn" id="send-btn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
const API = '/api/v1/chat';

const msgsEl   = document.getElementById('messages');
const inputEl  = document.getElementById('msg-input');
const sessionEl = document.getElementById('session-id');
const sendBtn  = document.getElementById('send-btn');

const BADGE = {
  k1_keyword:   ['K1', 'k1'],
  k2_similarity:['K2', 'k2'],
  fallback:     ['FB', 'fb'],
};

function genSessionId() {
  return 'user-' + Math.random().toString(36).slice(2, 7);
}

function newSession() {
  sessionEl.value = genSessionId();
  msgsEl.innerHTML = '';
  addBotMsg('Yeni oturum başlatıldı. Size nasıl yardımcı olabilirim?', null);
}

function scrollDown() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function addUserMsg(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = `
    <div class="msg-av">Siz</div>
    <div class="msg-body">
      <div class="bubble">${escHtml(text)}</div>
      <div class="meta">Siz</div>
    </div>`;
  msgsEl.appendChild(wrap);
  scrollDown();
}

function addBotMsg(text, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';

  let linksHtml = '';
  if (meta && meta.form_urls && Object.keys(meta.form_urls).length > 0) {
    const links = Object.entries(meta.form_urls)
      .map(([k, v]) => `<a class="form-link" href="${v}" target="_blank">${formatKey(k)}</a>`)
      .join('');
    linksHtml = `<div class="form-links">${links}</div>`;
  }

  let metaHtml = 'Asistan';
  if (meta && meta.source) {
    const [label, cls] = BADGE[meta.source] || ['', ''];
    const badge = label ? `<span class="badge ${cls}">${label}</span>` : '';
    const conf  = meta.confidence ? ` · %${Math.round(meta.confidence * 100)}` : '';
    const ms    = meta.response_ms ? ` · ${meta.response_ms}ms` : '';
    metaHtml = `Asistan ${badge}${conf}${ms}`;
  }

  wrap.innerHTML = `
    <div class="msg-av">BF</div>
    <div class="msg-body">
      <div class="bubble">${escHtml(text)}${linksHtml}</div>
      <div class="meta">${metaHtml}</div>
    </div>`;
  msgsEl.appendChild(wrap);
  scrollDown();
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'typing-wrap';
  el.id = 'typing';
  el.innerHTML = `
    <div class="msg-av" style="width:30px;height:30px;border-radius:50%;background:#e8eef6;color:#1A3C6E;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:2px;">BF</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  msgsEl.appendChild(el);
  scrollDown();
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function addError(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.innerHTML = `
    <div class="msg-av" style="width:30px;height:30px;border-radius:50%;background:#ffe3e3;color:#c92a2a;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px;">!</div>
    <div class="msg-body">
      <div class="error-bubble">${escHtml(text)}</div>
    </div>`;
  msgsEl.appendChild(wrap);
  scrollDown();
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function formatKey(k) {
  return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  const sessionId = sessionEl.value.trim() || genSessionId();

  inputEl.value = '';
  sendBtn.disabled = true;
  addUserMsg(text);
  addTyping();

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    removeTyping();

    if (!resp.ok) {
      const err = await resp.text();
      addError(`Sunucu hatası (${resp.status}): ${err.slice(0, 120)}`);
      return;
    }

    const data = await resp.json();
    addBotMsg(data.message, data);

  } catch (e) {
    removeTyping();
    addError('Sunucuya bağlanılamadı. API çalışıyor mu?');
    console.error(e);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

inputEl.focus();
</script>
</body>
</html>
